name: Chai Code Deploy Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        run: |
          docker build -t shriyanshagarwaldev/devops-test .  
          docker push shriyanshagarwaldev/devops-test

      - name: Deploy on ExCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 210.79.128.118
          username: ubuntu
          key: ${{ secrets.EXCLOUD_SSH_KEY }}
          script: |
            # Stop and remove existing container
            sudo docker rm -f devops-test || true
            # Pull the latest image
            sudo docker pull shriyanshagarwaldev/devops-test
            # Run the new container -d -p 80:3000 shriyanshagarwaldev/devops-test
            sudo docker run -d -p 80:3000 shriyanshagarwaldev/devops-test
            # Clean up old images
            sudo docker image prune -f
