name: Chai Code Deploy Workflow

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build and push Docker image
        run: |
          docker build -t shriyanshagarwaldev/devops-test .  
          docker push shriyanshagarwaldev/devops-test

      - name: Deploy on ExCloud
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: 210.79.128.118
          username: ubuntu
          key: ${{ secrets.EXCLOUD_SSH_KEY }}
          script: |

            #stop the existing containers
            sudo docker compose down

            #cd /home/ubuntu/Devops-test
            cd /home/ubuntu/Devops-test

            #git pull origin main
            git pull origin main

            #pull a fresh copy of shriyanshagarwaldev/devops-test
            sudo docker pull shriyanshagarwaldev/devops-test

            #docker compose up -d
            sudo docker compose up -d
            
            # clear old images
            sudo docker image prune -f